[package]
name = "ollama-chat-react"
version = "1.0.9"
description = "Client de chat pour Ollama avec éditeur de code agentique (Codex)"
authors = ["Grenofar"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ollama_chat_react_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros", "process", "sync"] }
tauri-plugin-autostart = "2"
enigo = "0.6.1"
xcap = "0.9.8"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Hand-rolled Phoenix Channels client for Supabase Realtime (Control Me
# remote pairing) — no official Rust Realtime SDK exists, so this talks the
# actual WebSocket protocol directly (verified against Supabase's protocol
# docs) rather than depending on an unproven community wrapper crate.
# rustls-tls-webpki-roots for wss://, consistent with reqwest's own
# rustls-tls choice elsewhere in this file (no openssl/native-tls).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
global-hotkey = "0.8.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
# Read-only UI Automation tree walking for Control Me's read_ui_elements
# tool — we only read properties (name, control type, bounding rect,
# enabled/offscreen state), never send input through it (enigo already
# handles that). default-features = false alone doesn't compile: v0.25.0's
# core.rs unconditionally imports crate::inputs::MouseButton even though
# that module is declared behind #[cfg(feature = "input")] in lib.rs — a
# real bug in the crate (confirmed by a failed cargo check), not a feature
# we asked for. "input" re-enabled just to satisfy that; "control"/
# "pattern" (which we genuinely don't need) stay off.
uiautomation = { version = "0.25", default-features = false, features = ["input"] }

